version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clio-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Siri Bhoovalaya Decipherment Platform
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://clio_user:clio_secret@postgres:5432/clio
      - SYNC_DATABASE_URL=postgresql://clio_user:clio_secret@postgres:5432/clio
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=clio
      - POSTGRES_USER=clio_user
      - POSTGRES_PASSWORD=clio_secret
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=siri_bhoovalaya_secret
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RENDER_DPI=300
    volumes:
      - clio_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: clio-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=clio
      - POSTGRES_USER=clio_user
      - POSTGRES_PASSWORD=clio_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clio_user -d clio"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18.0
    container_name: clio-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/siri_bhoovalaya_secret
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: clio-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: clio-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  clio_data:
  postgres_data:
  neo4j_data:
  qdrant_data:
  minio_data:

