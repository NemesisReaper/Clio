[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clio"
version = "0.1.0"
description = "Siri Bhoovalaya Agentic Decipherment Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.23.26",
    "opencv-python-headless>=4.9.0.80",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.28",
    "neo4j>=5.18.0",
    "qdrant-client>=1.8.0",
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

